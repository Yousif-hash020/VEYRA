        <svg class="nav-brand-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22"

          <polyline points="9 22 9 12 15 12 15 22"/>

        <span class="nav-brand-name">VEYRA</span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="guest-dashboard.html" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"

          </svg>
          <span>Explore</span>
        </a>

        <a href="guest-wishlist.html" class="nav-link active">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
            fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"

        </a>
      </nav>

      <!-- Right Actions -->
      <div class="nav-actions">

            <line x1="21" y1="12" x2="9" y2="12"/>

  <!-- ════════════════════════════════════════════════════════════════════════
       WISHLIST HEADER & CONTENT
  ═══════════════════════════════════════════════════════════════════════════ -->
  <main class="wishlist-main">
    <div class="wishlist-container">

      <!-- Header -->
      <div class="discovery-head">
        <div class="discovery-text">
          <p class="discovery-eyebrow">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"

            </svg>
            Saved Retreats
          </p>
          <h1 class="discovery-title">
            My <em>Wishlist</em>
          </h1>
          <p class="discovery-sub">Your favorite stays, all in one place.</p>
        </div>

        <div class="discovery-meta">
          <span class="results-count" id="wishlist-count">0 saved stays</span>
        </div>
      </div>

      <div class="masonry-grid" id="wishlist-grid">
        <!-- Loaded dynamically via guest-wishlist.js -->
      </div>
    </div>
  </main>

    <div class="footer-inner">
      <div class="footer-brand">
        <svg class="footer-brand-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"

          <polyline points="9 22 9 12 15 12 15 22"/>

        <span class="footer-tagline">— Discover Pakistan's finest stays</span>
      </div>
      <p class="footer-copy">&copy; 2026 VEYRA. All rights reserved.</p>
    </div>
